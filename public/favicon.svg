<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <title>A.T. mark</title>
  <!-- Ink follows the browser's light/dark setting; the top-centre dot is always red -->
  <style>
    .i { fill: #050505; }
    .r { stroke: #050505; }
    @media (prefers-color-scheme: dark) {
      .i { fill: #fbfbf9; }
      .r { stroke: #fbfbf9; }
    }
  </style>
  <circle class="i" cx="5" cy="5" r="4"/>
  <circle cx="15" cy="5" r="4" fill="#e02c24"/>
  <circle class="i" cx="25" cy="5" r="4"/>
  <circle class="i" cx="15" cy="15" r="4"/>
  <circle class="i" cx="15" cy="25" r="4"/>
  <g fill="none" stroke-width="1" class="r">
    <circle cx="5" cy="15" r="3.5"/><circle cx="25" cy="15" r="3.5"/>
    <circle cx="5" cy="25" r="3.5"/><circle cx="25" cy="25" r="3.5"/>
  </g>
</svg>
